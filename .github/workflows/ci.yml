name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "test/**", "package*.json", "tsconfig.json", ".github/workflows/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
